<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library</title>
<style>
:root{--bg:#1b2838;--bg2:#16202d;--top:#171a21;--tx:#c6d4df;--ac:#66c0f4;--mid:#2a475e}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 "Motiva Sans",Arial,Helvetica,sans-serif;display:flex;flex-direction:column}
.top{background:var(--top);height:42px;display:flex;align-items:center;padding:0 16px;gap:22px;flex:none}
.top a{color:#b8b6b4;font-weight:bold;font-size:14px;text-decoration:none;letter-spacing:.5px}
.top a.on{color:#fff}.top span{margin-left:auto;color:var(--ac);font-weight:bold}
.body{flex:1;display:flex;min-height:0}
.side{width:230px;background:var(--bg2);display:flex;flex-direction:column;flex:none}
.home{margin:8px;padding:12px;background:linear-gradient(90deg,#2a475e,#1b2838);font-weight:bold;letter-spacing:.5px}
.side input{margin:0 8px 8px;padding:6px 8px;background:#0f1822;border:1px solid #2f4254;color:var(--tx)}
.side h4{margin:6px 10px;font-size:11px;color:#8ba0b3;letter-spacing:.5px}
#list{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
#list li{padding:4px 10px 4px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#9fb1c0}
#list li:hover{background:#243447;color:#fff}
#list i{width:16px;height:16px;flex:none;display:block}
.add{padding:10px;background:#0f1822;color:#8ba0b3;cursor:default}
.main{flex:1;overflow:auto;padding:14px 18px;background:linear-gradient(#2a475e33,transparent 220px),var(--bg)}
.main h2{margin:0 0 12px;font-size:12px;font-weight:bold;letter-spacing:.6px;color:#dcdedf;display:flex;gap:6px}
.main h2 small{color:#6d8296;font-weight:normal}
#grid{display:flex;flex-wrap:wrap;gap:12px}
.card{width:150px;height:225px;position:relative;cursor:pointer;display:flex;align-items:flex-end;padding:10px;font:bold 20px/1.1 Georgia,serif;color:#fff;text-shadow:0 2px 4px #000;box-shadow:0 2px 8px #0008;transition:transform .12s}
.card:hover{transform:scale(1.05);z-index:2;outline:2px solid var(--ac)}
.card i{position:absolute;top:0;left:0;right:0;background:#1a9fff;color:#fff;font:bold 9px/1 Arial,sans-serif;padding:4px;text-align:center;text-shadow:none;letter-spacing:.4px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.bt{background:#3d4c5c;color:#fff;border:0;padding:6px 16px;cursor:pointer;font:bold 12px Arial,sans-serif}
.bt:hover{background:var(--ac);color:#000}
#stage{text-align:center}
canvas{background:#0f1822;border:2px solid #2f4254;max-width:100%}
iframe{width:100%;height:calc(100vh - 150px);border:0;background:#000}
.mem{display:grid;grid-template-columns:repeat(4,64px);gap:6px;justify-content:center}
.mem button{height:64px;font-size:28px;background:#1b2838;border:2px solid #3d6a8a;cursor:pointer}
.mem button[data-d]{background:#2d5a2d;border-color:#5a9a3a}
@media(max-width:700px){.side{display:none}}
</style>
</head>
<body>
<div class="top"><a href="#">STORE</a><a href="#" class="on">LIBRARY</a><a href="#">COMMUNITY</a><a href="#">PROFILE</a><span>Player1</span></div>
<div class="body">
 <div class="side">
  <div class="home">LIBRARY HOME</div>
  <input id="q" placeholder="Search" autocomplete="off">
  <h4>ALL GAMES</h4>
  <ul id="list"></ul>
  <div class="add">+ ADD A GAME</div>
 </div>
 <div class="main">
  <div id="lib"><h2>ALL GAMES <small id="count"></small></h2><div id="grid"></div></div>
  <div id="player" hidden>
   <div class="bar"><button class="bt" onclick="back()">&larr; Library</button><b id="pt"></b><span id="info" style="color:#8ba0b3"></span></div>
   <div id="stage"></div>
  </div>
 </div>
</div>
<script src="games.js"></script>
<script>
// ---- Settings ----
var BOOKING_URL='https://japanenterpriseskabinet.github.io/tabinet/';   // Esc sends you here instantly
var $=function(i){return document.getElementById(i)},rnd=function(n){return Math.floor(Math.random()*n)},timer,keyFn;
if(BOOKING_URL.indexOf('YOUR-')>-1)BOOKING_URL='../booking-site/index.html';
function info(t){$('info').textContent=t}
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;$('stage').appendChild(c);return c}
function stop(){clearInterval(timer);keyFn=null}

function render(){
  var q=$('q').value.toLowerCase(),n=0;$('grid').innerHTML='';$('list').innerHTML='';
  GAMES.forEach(function(g){
    if(q&&g.t.toLowerCase().indexOf(q)<0)return;n++;
    var d=document.createElement('div');d.className='card';d.style.background='linear-gradient(160deg,'+g.c+',#0a0f16)';
    d.innerHTML=(g.n?'<i>NEW TO LIBRARY</i>':'')+g.t;d.onclick=function(){play(g)};$('grid').appendChild(d);
    var l=document.createElement('li');l.innerHTML='<i style="background:'+g.c+'"></i>'+g.t;l.onclick=function(){play(g)};$('list').appendChild(l);
  });
  $('count').textContent='('+n+')';
}
function play(g){
  stop();$('lib').hidden=true;$('player').hidden=false;$('pt').textContent=g.t;$('stage').innerHTML='';info('');
  if(g.built)BUILT[g.built]();
  else{var f=document.createElement('iframe');f.src=g.url;f.allowFullscreen=true;$('stage').appendChild(f)}
}
function back(){stop();$('stage').innerHTML='';$('player').hidden=true;$('lib').hidden=false}
$('q').oninput=render;
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){location.replace(BOOKING_URL);return}
  if(keyFn)keyFn(e);
});

function snake(){
  var c=mk(300,300),x=c.getContext('2d'),s=[[10,10]],d=[1,0],nd=d,f=[5,5],sc=0;
  info('Arrow keys or WASD');
  keyFn=function(e){
    var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
    if(m){e.preventDefault();if(m[0]+d[0]||m[1]+d[1])nd=m}
  };
  timer=setInterval(function(){
    d=nd;var h=[s[0][0]+d[0],s[0][1]+d[1]];
    if(h[0]<0||h[1]<0||h[0]>19||h[1]>19||s.some(function(p){return p[0]==h[0]&&p[1]==h[1]})){s=[[10,10]];d=nd=[1,0];sc=0}
    else{s.unshift(h);if(h[0]==f[0]&&h[1]==f[1]){sc++;f=[rnd(20),rnd(20)]}else s.pop()}
    x.fillStyle='#fff7ee';x.fillRect(0,0,300,300);
    x.fillStyle='#f26a00';s.forEach(function(p){x.fillRect(p[0]*15,p[1]*15,14,14)});
    x.fillStyle='#c8102e';x.fillRect(f[0]*15,f[1]*15,14,14);
    info('Snake - Score: '+sc);
  },100);
}

function breakout(){
  var c=mk(360,300),x=c.getContext('2d'),px=150,bx=180,by=200,vx=3,vy=-3,sc=0,l=[];
  function reset(){l=[];for(var r=0;r<5;r++)for(var i=0;i<9;i++)l.push([i*40+2,r*18+20,1])}
  reset();info('Mouse or left/right arrows');
  c.onmousemove=function(e){px=e.offsetX-30};
  keyFn=function(e){if(e.key=='ArrowLeft'){px-=30;e.preventDefault()}if(e.key=='ArrowRight'){px+=30;e.preventDefault()}};
  timer=setInterval(function(){
    bx+=vx;by+=vy;
    if(bx<5||bx>355)vx=-vx;
    if(by<5)vy=-vy;
    if(by>280&&by<292&&bx>px&&bx<px+60){vy=-Math.abs(vy);vx=(bx-px-30)/8}
    if(by>300){bx=180;by=200;vx=3;vy=-3;sc=0;reset()}
    l.forEach(function(b){if(b[2]&&bx>b[0]&&bx<b[0]+36&&by>b[1]&&by<b[1]+14){b[2]=0;vy=-vy;sc++}});
    if(!l.some(function(b){return b[2]}))reset();
    x.fillStyle='#fff7ee';x.fillRect(0,0,360,300);
    x.fillStyle='#f26a00';l.forEach(function(b){if(b[2])x.fillRect(b[0],b[1],36,14)});
    x.fillStyle='#1c4fa0';x.fillRect(px,285,60,8);
    x.fillStyle='#c8102e';x.beginPath();x.arc(bx,by,5,0,7);x.fill();
    info('Breakout - Score: '+sc);
  },16);
}

function memory(){
  var E=['🍣','🍙','🍜','🍡','🌸','⛩','🗻','🚄'],a=E.concat(E).sort(function(){return Math.random()-.5}),o=[],pairs=0,moves=0;
  var g=document.createElement('div');g.className='mem';$('stage').appendChild(g);
  info('Find all 8 pairs');
  a.forEach(function(v){
    var b=document.createElement('button');b.textContent='?';
    b.onclick=function(){
      if(o.length>1||b.dataset.d||o.indexOf(b)>-1)return;
      b.textContent=v;o.push(b);
      if(o.length==2){
        moves++;
        if(o[0].textContent==o[1].textContent){o.forEach(function(z){z.dataset.d=1});o=[];pairs++;info(pairs==8?'Done in '+moves+' moves! Pick Memory to play again.':'Pairs: '+pairs+' / 8 - Moves: '+moves)}
        else setTimeout(function(){o.forEach(function(z){z.textContent='?'});o=[]},700);
      }
    };
    g.appendChild(b);
  });
}

var BUILT={snake:snake,breakout:breakout,memory:memory};
render();
</script>
</body>
</html>
